apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: file-storage-pvc
  labels:
    app: file-storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: file-storage-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: file-storage-backend
  template:
    metadata:
      labels:
        app: file-storage-backend
    spec:
      containers:
        - name: backend
          image: file-storage-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: api
              containerPort: 3000
            - name: storage
              containerPort: 3001
          env:
            - name: DB_PATH
              value: "/app/data/files.db"
            - name: STORAGE_DIR
              value: "/app/data/storage-disk"
            - name: API_SERVER_URL
              value: "http://localhost:3000"
          volumeMounts:
            - name: storage-volume
              mountPath: /app/data
      volumes:
        - name: storage-volume
          persistentVolumeClaim:
            claimName: file-storage-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  labels:
    app: file-storage-backend
spec:
  type: ClusterIP
  ports:
    - name: api
      port: 3000
      targetPort: 3000
    - name: storage
      port: 3001
      targetPort: 3001
  selector:
    app: file-storage-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    app: file-storage-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: file-storage-frontend
  template:
    metadata:
      labels:
        app: file-storage-frontend
    spec:
      containers:
        - name: frontend
          image: file-storage-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  labels:
    app: file-storage-frontend
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      targetPort: 80
  selector:
    app: file-storage-frontend
